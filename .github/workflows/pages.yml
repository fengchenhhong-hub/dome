name: Publish portfolio
on:
  workflow_dispatch:

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare local page sources
        run: |
          mkdir -p public
          cp index.html room.css room.js ping.html lite.html public/
      - name: Import and verify public assets
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! python3 import-public-site.py --reuse-verified-derived; then
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              sudo apt-get update
              sudo apt-get install --yes --no-install-recommends ffmpeg
            fi
            python3 import-public-site.py
          fi
      - name: Keep assets in this repository
        run: |
          git add public
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Import verified portfolio media'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

